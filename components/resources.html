<section class="resource-section section-shell container" id="recursos">
    <div class="section-heading">
        <div>
            <p class="eyebrow">BIBLIOTECA DE APRENDIZAJE</p>
            <h2>Encuentra tu próximo <span>recurso</span></h2>
            <p class="section-description">Explora guías organizadas por área o busca una tecnología.</p>
        </div>
        <div class="resource-count"><strong id="resource-count">6</strong><span>recursos<br>para explorar</span></div>
    </div>

    <div class="resource-toolbar">
        <div class="filter-list" role="group" aria-label="Filtrar recursos por categoría">
            <button class="filter-button selected" type="button" data-filter="todos" aria-pressed="true">Todos <span>06</span></button>
            <button class="filter-button" type="button" data-filter="backend" aria-pressed="false">Backend</button>
            <button class="filter-button" type="button" data-filter="fullstack" aria-pressed="false">Full Stack</button>
            <button class="filter-button" type="button" data-filter="datos" aria-pressed="false">Bases de datos</button>
            <button class="filter-button" type="button" data-filter="fundamentos" aria-pressed="false">Fundamentos</button>
            <button class="filter-button" type="button" data-filter="estructuras" aria-pressed="false">Estructuras de datos</button>
        </div>
        <label class="search-box">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.8" stroke="currentColor" stroke-width="1.6"/><path d="m13.2 13.2 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="sr-only">Buscar recursos</span>
            <input id="resource-search" type="search" placeholder="Buscar recurso..." autocomplete="off">
            <kbd>/</kbd>
        </label>
    </div>

    <div class="resource-grid row g-3" id="resource-grid" aria-live="polite"></div>
    <p class="empty-state" id="empty-state" hidden>No encontramos recursos con esa búsqueda. Prueba con otro término.</p>
</section>
